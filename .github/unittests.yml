name: CI

on:
  push:
    branches: [ main, setup-task, "eda-*" , compare-countries, dashboard-dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test (python --version)
        run: python --version

      - name: Run unit tests
        run: |
          if [ -d "./tests" ]; then pytest -q || true; fi
